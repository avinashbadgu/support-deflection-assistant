[project]
name = "support-assistant"
version = "0.1.0"
description = "Support-deflection assistant with grounded answering, abstention, and a closed eval loop."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "chromadb>=0.5",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "tqdm>=4.66",
    "tenacity>=8.5",
    "structlog>=24.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "prefect>=3.0",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]
crossencoder = [
    "sentence-transformers>=3.0",
]

[project.scripts]
support-assistant = "support_assistant.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
